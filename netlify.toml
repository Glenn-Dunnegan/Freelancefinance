[build]
  command = "npm run build"
  publish = "dist"

# Force HTTPS and remove www prefix
[[redirects]]
  from = "http://www.freelance-finance.com/*"
  to = "https://freelance-finance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://freelance-finance.com/*"
  to = "https://freelance-finance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.freelance-finance.com/*"
  to = "https://freelance-finance.com/:splat"
  status = 301
  force = true

# Catch-all for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term caching for hashed JS/CSS assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML so updates deploy quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Short cache for root
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
