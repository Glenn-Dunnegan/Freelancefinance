[build]
  command = "npm run build"
  publish = "dist"

# Force HTTPS and remove www prefix
[[redirects]]
  from = "http://www.freelance-finance.com/*"
  to = "https://freelance-finance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://freelance-finance.com/*"
  to = "https://freelance-finance.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.freelance-finance.com/*"
  to = "https://freelance-finance.com/:splat"
  status = 301
  force = true

# Catch-all for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
